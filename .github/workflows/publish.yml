# The release, from a tag: the tag's tree is built and published to npm as
# @volter/tabnode with provenance, and the GitHub release is made with the
# changelog's section for the version as its notes. scripts/release.sh cuts
# the tag. The publish authenticates with the repository secret NPM_TOKEN
# until npm's trusted publisher for this workflow is confirmed
# (RELEASING.md); then the secret and the NODE_AUTH_TOKEN line go.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: An npm that publishes with provenance
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:lib
      - name: The version is the tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: The GitHub release, with the changelog's section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v h="## $GITHUB_REF_NAME " 'index($0, h) == 1 { p = 1; next } p && /^## / { exit } p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "${notes:-$GITHUB_REF_NAME}"
