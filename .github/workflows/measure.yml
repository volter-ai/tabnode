# Objective Node 24 baseline. No score or threshold gates a release.
name: measure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - name: Exact Node 24.21.0 test tree
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/nodejs/node.git ../node-tests
          git -C ../node-tests sparse-checkout set test/common test/parallel test/fixtures test/wasi test/module-hooks test/es-module
          git -C ../node-tests checkout -q v24.21.0
      - name: Enumerate native contracts
        run: node scripts/native-surface.mjs --out measurement/native.json
      - name: Compare public builtin shapes with real Node 24.21.0
        run: node scripts/public-surface.mjs --out measurement/public.json
      - name: Every Node 24 parallel and WASI test file
        run: node scripts/node-tests.mjs --tests ../node-tests --all --report-json measurement/results.json
      - name: Four counts, three lists, and capability ledger
        run: |
          node scripts/node-test-report.mjs --out measurement --summary "$GITHUB_STEP_SUMMARY"
          node scripts/capability-ledger.mjs --out measurement
      - name: Retain every result and its evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-measurement-${{ github.sha }}
          path: measurement/
          if-no-files-found: error
